<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTACT | GANAR Official Website</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Noto+Sans+JP:wght@400;700;900&family=Teko:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-[#050a14] text-white font-sans antialiased selection:bg-[#00f0ff] selection:text-black contact-page">

    <!-- グローバルヘッダー -->
    <div id="global-header"></div>

    <main class="max-w-4xl mx-auto px-6 py-12 md:py-20 text-white pt-24 md:pt-28">
        <!-- 二重タイポグラフィ見出し -->
        <div class="section-title-wrapper mb-16">
            <span class="section-title-bg">CONTACT</span>
            <div class="section-title-front flex flex-col">
                <h2 class="text-5xl md:text-7xl font-bold tracking-wider font-teko text-white leading-none">CONTACT</h2>
                <span class="text-xs font-bold tracking-[0.3em] text-[#00f0ff] mt-1 font-chakra uppercase">お問い合わせ</span>
            </div>
            <div class="section-title-line"></div>
        </div>

        <div class="cyber-card rounded-3xl p-8 md:p-12 shadow-xl text-white">
            <form action="https://formspree.io/f/xbdjqnrw" method="POST" class="space-y-6 font-bold contact-form">
                <div>
                    <label class="block text-xs uppercase tracking-[0.2em] text-gray-400 mb-2 font-chakra">Name / お名前</label>
                    <input type="text" name="name" placeholder="GANAR 太郎" required class="w-full bg-white/5 border border-white/10 rounded-xl p-4 text-white placeholder-gray-500 focus:border-[#00f0ff] focus:ring-1 focus:ring-[#00f0ff] outline-none transition-all">
                </div>

                <div>
                    <label class="block text-xs uppercase tracking-[0.2em] text-gray-400 mb-2 font-chakra">Email Address / メールアドレス</label>
                    <input type="email" name="_replyto" placeholder="example@mail.com" required class="w-full bg-white/5 border border-white/10 rounded-xl p-4 text-white placeholder-gray-500 focus:border-[#00f0ff] focus:ring-1 focus:ring-[#00f0ff] outline-none transition-all">
                </div>

                <div>
                    <label class="block text-xs uppercase tracking-[0.2em] text-gray-400 mb-2 font-chakra">Category / お問い合わせ項目</label>
                    <div class="relative">
                        <select name="category" class="w-full bg-[#050a14] border border-white/10 rounded-xl p-4 text-white focus:border-[#00f0ff] focus:ring-1 focus:ring-[#00f0ff] outline-none appearance-none cursor-pointer">
                            <option value="recruit" class="bg-[#050a14] text-white">メンバー募集に関するお問い合わせ</option>
                            <option value="business" class="bg-[#050a14] text-white">お仕事・タイアップのご依頼</option>
                            <option value="sponsor" class="bg-[#050a14] text-white">スポンサー・パートナーに関して</option>
                            <option value="interview" class="bg-[#050a14] text-white">取材・メディア掲載について</option>
                            <option value="trouble" class="bg-[#050a14] text-white">違反行為・トラブルの通報</option>
                            <option value="fan-message" class="bg-[#050a14] text-white">応援メッセージ</option>
                            <option value="other" class="bg-[#050a14] text-white">その他</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-400">
                            <svg class="fill-current h-4 w-4" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs uppercase tracking-[0.2em] text-gray-400 mb-2 font-chakra">Message / お問い合わせ内容</label>
                    <textarea name="message" rows="6" placeholder="内容をご記入ください" required class="w-full bg-white/5 border border-white/10 rounded-xl p-4 text-white placeholder-gray-500 focus:border-[#00f0ff] focus:ring-1 focus:ring-[#00f0ff] outline-none transition-all"></textarea>
                </div>

                <!-- 他のボタンと同じcyber-btnクラスを適用しつつ送信機能を維持 -->
                <button type="submit" class="cyber-btn inline-flex items-center justify-center w-full py-5 cursor-pointer">
                    <span class="font-teko text-2xl font-black italic tracking-wider uppercase">Send Message</span>
                </button>
                
                <p class="text-[10px] text-gray-400 text-center mt-4 font-chakra tracking-wider">※数日以内に担当者よりご返信いたします。</p>
            </form>
        </div>
    </main>

    <!-- グローバルフッター -->
    <div id="global-footer"></div>

    <!-- Scripts -->
    <script src="assets/js/header-footer.js"></script>
</body>
</html>
