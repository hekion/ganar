<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEWS | GANAR Official Website</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Noto+Sans+JP:wght@400;700;900&family=Teko:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-[#050a14] text-white font-sans antialiased selection:bg-[#00f0ff] selection:text-black">

    <!-- グローバルヘッダー -->
    <div id="global-header"></div>

    <main class="max-w-[1200px] mx-auto px-6 mb-24 py-12 md:py-20 text-white pt-24 md:pt-28">
        <!-- 二重タイポグラフィ見出し -->
        <div class="section-title-wrapper mb-16">
            <span class="section-title-bg">NEWS</span>
            <div class="section-title-front flex flex-col">
                <h2 class="text-5xl md:text-7xl font-bold tracking-wider font-teko text-white leading-none">NEWS</h2>
                <span class="text-xs font-bold tracking-[0.3em] text-[#00f0ff] mt-1 font-chakra uppercase">ニュース</span>
            </div>
            <div class="section-title-line"></div>
        </div>

        <div id="news-container" class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <p class="col-span-full text-center py-20 text-gray-400 font-sans">読み込み中...</p>
        </div>

        <div id="pagination" class="mt-16 flex justify-center items-center gap-6 hidden">
            <button id="prev-btn" class="cyber-btn">PREV</button>
            <span id="page-info" class="font-teko text-2xl font-bold tracking-widest text-[#00f0ff]">1 / 1</span>
            <button id="next-btn" class="cyber-btn">NEXT</button>
        </div>
    </main>

    <!-- グローバルフッター -->
    <div id="global-footer"></div>

    <!-- Scripts -->
    <script src="assets/js/header-footer.js"></script>
    <script src="assets/js/news-api.js"></script>
</body>
</html>
