<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABOUT | GANAR Official Website</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Noto+Sans+JP:wght@400;700;900&family=Teko:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-[#050a14] text-white font-sans antialiased selection:bg-[#00f0ff] selection:text-black pt-24 md:pt-28 about-page">

    <!-- グローバルヘッダー -->
    <div id="global-header"></div>

    <main class="max-w-4xl mx-auto px-6 py-12 md:py-20 text-white">
        <!-- 二重タイポグラフィ見出し -->
        <div class="section-title-wrapper mb-16">
            <span class="section-title-bg">ABOUT</span>
            <div class="section-title-front flex flex-col">
                <h2 class="text-5xl md:text-7xl font-bold tracking-wider font-teko text-white leading-none">ABOUT</h2>
                <span class="text-xs font-bold tracking-[0.3em] text-[#00f0ff] mt-1 font-chakra uppercase">チームについて</span>
            </div>
            <div class="section-title-line"></div>
        </div>

        <div class="w-full">
            <h1 class="text-[14vw] md:text-[8rem] font-black italic tracking-tighter text-white uppercase drop-shadow-lg font-teko mb-12 text-center md:text-left about-hero-title">
                HAVE FUN <br class="md:hidden">AND WIN
            </h1>

            <div class="space-y-12 text-white/95">
                <div class="cyber-card p-8 md:p-12 rounded-2xl space-y-6">
                    <p class="text-base md:text-xl font-bold leading-relaxed">
                        これには2つの意味を込めています。
                    </p>
                    <ul class="space-y-4 text-sm md:text-lg">
                        <li class="flex items-start gap-3">
                            <span class="list-dot"></span>
                            <span>せっかくやるなら、楽しみながら勝ちにいく。</span>
                        </li>
                        <li class="flex items-start gap-3">
                            <span class="list-dot"></span>
                            <span>たとえ勝てなかったとしても、誰よりも楽しめたなら、それはもう勝ち。</span>
                        </li>
                    </ul>
                    <p class="text-sm md:text-lg leading-relaxed pt-6 border-t border-white/20">
                        勝負にはこだわるけど、それ以上に「その場をどれだけ楽しめるか」を一番大切にしています。
                    </p>
                </div>

                <div class="cyber-card p-8 md:p-12 rounded-2xl space-y-4">
                    <p class="text-sm md:text-lg leading-relaxed">
                        ただのゲームチームというより、遊びもノリも本気で共有できるチームでありたい。
                    </p>
                    <p class="text-sm md:text-lg leading-relaxed">
                        これから、この考えがいいなと思ってくれる人が自然に集まってくるようなチームにしていきたいです。
                    </p>
                </div>
            </div>
        </div>
    </main>

    <!-- グローバルフッター -->
    <div id="global-footer"></div>

    <!-- Scripts -->
    <script src="assets/js/header-footer.js"></script>
</body>
</html>
