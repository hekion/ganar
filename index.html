<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GANAR Official Website</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Inter / Montserrat) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Montserrat:wght@700;800;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-[#070a12] text-white font-sans antialiased selection:bg-[#00f0ff] selection:text-black">

    <!-- グローバルヘッダー -->
    <div id="global-header"></div>

    <!-- メインビジュアル -->
    <section class="relative w-full pt-20 md:pt-24">
        <div class="w-full relative overflow-hidden border-b border-white/10">
            <picture>
                <source media="(min-width: 768px)" srcset="assets/images/visual/main-pc.png">
                <img src="assets/images/visual/main-sp.png" alt="GANAR Main Visual" class="w-full h-auto object-cover block">
            </picture>
        </div>
    </section>

    <!-- コンセプトセクション -->
    <section class="py-24 md:py-36 px-6 relative border-b border-white/5">
        <div class="max-w-[1200px] mx-auto">
            <!-- CR風 洗練された二重タイポグラフィ -->
            <div class="section-title-wrapper">
                <span class="section-title-bg">CONCEPT</span>
                <div class="section-title-front">
                    <h2>CONCEPT</h2>
                    <span>コンセプト</span>
                </div>
            </div>
            
            <div class="clean-card p-8 md:p-16 rounded-xl max-w-[1000px] mx-auto text-center space-y-8">
                <p class="text-2xl md:text-3xl font-bold text-white leading-relaxed tracking-wide">
                    勝利にこだわりながらも、<br class="hidden md:block">「楽しむこと」を何より大切にします。
                </p>
                <div class="w-12 h-[2px] bg-[#00f0ff] mx-auto"></div>
                <p class="text-base md:text-lg text-gray-400 leading-relaxed max-w-[750px] mx-auto font-normal">
                    結果だけではなく、過程や熱量、一緒にプレイする時間そのものを価値として捉えています。
                </p>
            </div>
        </div>
    </section>

    <!-- ニュースセクション -->
    <section class="py-24 px-6 relative">
        <div class="max-w-[1200px] mx-auto">
            <!-- CR風 洗練された二重タイポグラフィ -->
            <div class="section-title-wrapper">
                <span class="section-title-bg">NEWS</span>
                <div class="section-title-front">
                    <h2>NEWS</h2>
                    <span>最新情報</span>
                </div>
            </div>
            
            <div id="news-container" class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <p class="text-center py-10 text-gray-500 font-sans col-span-full">読み込み中...</p>
            </div>

            <div class="mt-16 text-center">
                <a href="news.html" class="clean-btn">
                    VIEW ALL NEWS
                </a>
            </div>
        </div>
    </section>

    <!-- スポンサー・パートナーセクション -->
    <section class="py-24 md:py-36 px-6 relative border-t border-white/5">
        <div class="max-w-[1200px] mx-auto">
            <!-- CR風 洗練された二重タイポグラフィ -->
            <div class="section-title-wrapper">
                <span class="section-title-bg">SPONSOR</span>
                <div class="section-title-front">
                    <h2>SPONSOR</h2>
                    <span>スポンサー / パートナー</span>
                </div>
            </div>

            <div class="max-w-[800px] mx-auto text-center">
                <div class="text-lg md:text-xl font-medium space-y-4 mb-12 text-gray-300 leading-relaxed">
                    <p>GANARでは、活動を応援していただける<br class="hidden md:block">スポンサー様・パートナー様を募集しております。</p>
                    <p class="text-sm md:text-base text-gray-500 font-normal">企業・個人は問いません。ご興味をお持ちいただけましたら、ぜひお気軽にご連絡ください。</p>
                </div>
                <a href="contact.html" class="clean-btn">
                    CONTACT US
                </a>
            </div>
        </div>
    </section>

    <!-- グローバルフッター -->
    <div id="global-footer"></div>

    <!-- Scripts -->
    <script src="assets/js/header-footer.js"></script>
    <script src="assets/js/news-api.js"></script>
</body>
</html>
