<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEWS DETAIL | GANAR Official Website</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Noto+Sans+JP:wght@400;700;900&family=Teko:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-[#050a14] text-white font-sans antialiased selection:bg-[#00f0ff] selection:text-black">

    <!-- グローバルヘッダー -->
    <div id="global-header"></div>

    <main class="max-w-[800px] mx-auto px-6 py-12 md:py-20 text-white pt-24 md:pt-28">
        <div id="loader" class="text-center py-20 text-gray-400 font-sans">読み込み中...</div>

        <article id="news-article" class="hidden">
            <div class="flex items-center gap-4 mb-6">
                <span id="news-category" class="bg-[#050a14]/90 backdrop-blur-md text-[#00f0ff] border border-[#00f0ff]/40 text-xs font-bold px-3 py-1 rounded font-chakra tracking-wider uppercase"></span>
                <span id="news-date" class="text-xs font-bold tracking-widest text-gray-400 font-chakra"></span>
            </div>
            <h1 id="news-title" class="text-3xl md:text-5xl font-bold mb-10 leading-tight text-white"></h1>
            <div class="aspect-video w-full bg-black/50 rounded-2xl overflow-hidden mb-12 shadow-2xl border border-white/10">
                <img id="news-image" src="" alt="" class="w-full h-full object-cover" referrerpolicy="no-referrer">
            </div>
            <div id="news-content" class="text-base md:text-lg mb-20 text-white/90 leading-relaxed font-sans space-y-4"></div>
            <hr class="border-white/10 mb-12">
        </article>

        <div class="text-center">
            <a href="news.html" class="cyber-btn inline-flex items-center justify-center px-10 py-4">
                <span class="text-xl font-bold tracking-widest">← BACK TO NEWS</span>
            </a>
        </div>
    </main>

    <!-- グローバルフッター -->
    <div id="global-footer"></div>

    <!-- Scripts -->
    <script src="assets/js/header-footer.js"></script>
    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyVJp-zqYfROpOGgh9Oqmvtx8FxG78fRm07eWfxeHpQVgSrHGxDADtDVlXqb_6nvplPRw/exec";

        function getStableDriveUrl(url) {
            if (!url) return 'assets/images/logo/ganar.png';
            const idMatch = url.match(/[-\w]{25,}(?!.*[-\w]{25,})/);
            if (idMatch) {
                return `https://drive.google.com/thumbnail?id=${idMatch[0]}&sz=s1000`;
            }
            return url;
        }

        function formatContent(text) {
            if (!text) return "";
            let escaped = text.toString()
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
            
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            let linked = escaped.replace(urlRegex, '<a href="$1" target="_blank" rel="noopener noreferrer" class="text-[#00f0ff] underline hover:no-underline">$1</a>');
            
            return linked.replace(/\n/g, '<br>');
        }

        async function loadNewsDetail() {
            const urlParams = new URLSearchParams(window.location.search);
            const targetId = urlParams.get('id');

            if (!targetId) {
                window.location.href = 'news.html';
                return;
            }

            try {
                const response = await fetch(GAS_URL);
                const data = await response.json();
                const item = data.find(n => String(n.id) === String(targetId));

                if (!item) {
                    document.getElementById('loader').innerText = "記事が見つかりませんでした。";
                    return;
                }

                const date = new Date(item.date);
                const dateString = isNaN(date) ? item.date : `${date.getFullYear()}.${String(date.getMonth() + 1).padStart(2, '0')}.${String(date.getDate()).padStart(2, '0')}`;

                document.getElementById('news-title').innerText = item.title;
                document.getElementById('news-category').innerText = item.category;
                document.getElementById('news-date').innerText = dateString;
                document.getElementById('news-content').innerHTML = formatContent(item.content);
                
                const imgElement = document.getElementById('news-image');
                imgElement.src = getStableDriveUrl(item.imageUrl);
                
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('news-article').classList.remove('hidden');
                document.title = `${item.title} | GANAR NEWS`;

            } catch (error) {
                document.getElementById('loader').innerText = "エラーが発生しました。";
            }
        }
        loadNewsDetail();
    </script>
</body>
</html>
